name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  node:
    name: Web + Server + SQLite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install npm workspaces
        run: npm ci --no-audit --no-fund
      - name: Build contracts, Server and Web
        run: npm run build
      - name: TypeScript / Vue typecheck
        run: npm run typecheck
      - name: ESLint
        run: npm run lint:ts
      - name: Server and SQLite tests
        run: npm run test:server
      - name: Apply migrations twice
        run: |
          npm run db:migrate
          npm run db:migrate
      - name: Initialize local M1 test credentials (CLI only)
        env:
          NAVLOOM_ADMIN_USERNAME: admin
          NAVLOOM_ADMIN_PASSWORD: test-admin-password-123
          NAVLOOM_HOME_PASSPHRASE: test-home-1234
        run: |
          npm run admin:init -w @navloom/server
          if npm run admin:init -w @navloom/server; then
            echo "Admin initialization must not overwrite an existing administrator"
            exit 1
          fi
      - name: Development Server + Web HTTP smoke
        run: |
          set -euo pipefail
          npm run start -w @navloom/server > /tmp/navloom-server.log 2>&1 &
          server_pid=$!
          npm run dev -w @navloom/web > /tmp/navloom-web.log 2>&1 &
          web_pid=$!
          trap 'kill "$server_pid" "$web_pid" 2>/dev/null || true' EXIT

          server_ready=false
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/v1/system/status | grep -q navloom-server; then
              server_ready=true
              break
            fi
            sleep 1
          done
          if [ "$server_ready" != true ]; then
            cat /tmp/navloom-server.log
            exit 1
          fi

          web_ready=false
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5173/ | grep -q Navloom; then
              web_ready=true
              break
            fi
            sleep 1
          done
          if [ "$web_ready" != true ]; then
            cat /tmp/navloom-web.log
            exit 1
          fi
          curl -fsS http://127.0.0.1:5173/admin/login | grep -q Navloom
          curl -fsS http://127.0.0.1:5173/api/v1/system/status | grep -q navloom-server
          ./scripts/smoke-m1.sh
      - name: Development Compose syntax
        run: docker compose -f compose.dev.yml config --quiet

  go:
    name: Go Agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
      - name: gofmt check
        working-directory: agent
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Go files need formatting:"
            echo "$unformatted"
            gofmt -d .
            exit 1
          fi
      - name: Go tests
        working-directory: agent
        run: go test ./...
      - name: Docker event and Agent WSS race detection
        working-directory: agent
        run: go test -race ./internal/probe ./internal/transport
      - name: Build Linux amd64 and arm64
        working-directory: agent
        run: ./scripts/build-linux.sh
      - name: Agent CLI and unavailable Server smoke
        working-directory: agent
        run: |
          go run ./cmd/navloom-agent -version | grep -q "Navloom Agent"
          if NAVLOOM_SERVER_URL=ws://127.0.0.1:9/agent NAVLOOM_ALLOW_INSECURE_DEV=true go run ./cmd/navloom-agent -check; then
            echo "Expected the unreachable Server check to fail"
            exit 1
          fi

  compose:
    name: Local Docker Compose startup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Start dev Compose and check both HTTP endpoints
        run: |
          set -euo pipefail
          docker compose -f compose.dev.yml up -d
          trap 'docker compose -f compose.dev.yml down -v || true' EXIT
          ready=false
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3000/api/v1/system/status | grep -q navloom-server && curl -fsS http://127.0.0.1:5173/ | grep -q Navloom; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            docker compose -f compose.dev.yml logs
            exit 1
          fi
          echo "Navloom development Compose endpoints are reachable"

  m2-transport:
    name: M2 Go-to-Node WSS integration
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
      - name: Install pinned npm dependencies
        run: npm ci --no-audit --no-fund
      - name: Build Server and contracts
        run: npm run build:contracts && npm run build:server
      - name: Real Go passive Agent, Node active Server and isolated Docker acceptance
        env:
          NAVLOOM_CI_DOCKER_FIXTURES: "1"
        run: node scripts/smoke-m2-reverse.mjs
