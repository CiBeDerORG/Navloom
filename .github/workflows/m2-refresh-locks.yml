name: Temporary M2 transport dependency lock refresh

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/m2-refresh-locks.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Regenerate npm lock without running package scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
      - name: Generate Go sums and format transport sources
        working-directory: agent
        run: |
          go mod tidy
          gofmt -w cmd/navloom-agent/main.go internal/protocol/message.go internal/transport/*.go
      - name: Commit generated lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json agent/go.mod agent/go.sum agent/cmd/navloom-agent/main.go agent/internal/protocol/message.go agent/internal/transport/client.go agent/internal/transport/client_test.go
          if ! git diff --cached --quiet; then
            git commit -m "chore(m2): lock WSS dependencies and gofmt"
            git push origin HEAD:main
          fi
